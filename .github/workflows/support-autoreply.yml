# Automatic confirmation for theme support requests. The support form on
# the documentation site opens an issue labeled "support"; this replies at
# once with the request number, the response time and what to add.
name: Support auto-reply

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  confirm:
    if: contains(github.event.issue.labels.*.name, 'support')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            if (comments.data.some((c) => c.body.includes('<!-- support-autoreply -->'))) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                '<!-- support-autoreply -->',
                `Thanks, we have your request (#${number}).`,
                '',
                'We reply within **one business day**, Monday to Friday. Problems that stop checkout or break a page are answered first.',
                '',
                'To help us answer in one go, add if you have not yet:',
                '- your store URL (your-store.myshopify.com)',
                '- the page where it happens and the steps to see it',
                '- a screenshot or short screen recording',
                '',
                'Please never post passwords or staff account details here. If we need access, we send a collaborator request.',
              ].join('\n'),
            });
